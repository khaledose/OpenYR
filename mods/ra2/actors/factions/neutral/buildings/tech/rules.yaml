caoild:
	Inherits: ^TechBuilding
	Inherits@SHAPE: ^2x2Shape
	IsometricSelectable:
		DecorationHeight: 75
	Health:
		HP: 100000
	Armor:
		Type: Steel
	RevealsShroud:
		Range: 6c0
	Tooltip:
		Name: actor-caoild.name
	Tooltip@NoRow:
		Name: actor-caoild.name
	TooltipDescription:
		Description: actor-caoild.description
	UpdatesDerrickCount:
	GivesCashOnCapture:
		Amount: 1000
	CashTrickler:
		InitialDelay: 100
		Interval: 100
		Amount: 20
		RequiresCondition: enabled
	FireWarheadsOnDeath:
		Weapon: OilExplosion
	WithIdleOverlay@pump:
		Sequence: idle-pump
		PauseOnCondition: !enabled
	WithIdleOverlay@flag:
		Sequence: flag
	AmbientSound@running:
		SoundFiles: boillo2a.wav, boillo2b.wav, boillo2c.wav
		RequiresCondition: enabled

caairp:
	Inherits: ^TechBuilding
	Inherits@SHAPE: ^3x3Shape
	IsometricSelectable:
		DecorationHeight: 90
	Health:
		HP: 80000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 6c0
	Tooltip:
		Name: actor-caairp.name
	Tooltip@NoRow:
		Name: actor-caairp.name
	TooltipDescription:
		Description: actor-caairp.description
	ProvidesPrerequisite@allies:
		Prerequisite: techparadrops.allies
		Factions: america, germany, england, france, korea
		ResetOnOwnerChange: true
		RequiresCondition: enabled
	ProvidesPrerequisite@Soviets:
		Prerequisite: techparadrops.soviets
		Factions: cuba, libya, iraq, russia
		ResetOnOwnerChange: true
		RequiresCondition: enabled
	ProvidesPrerequisite@PsiCorps:
		Prerequisite: techparadrops.psicorps
		Factions: psicorps
		ResetOnOwnerChange: true
		RequiresCondition: enabled
	SupportPowerChargeBar:
	WithIdleOverlay:
	WithIdleOverlay@flag:
		Sequence: flag

