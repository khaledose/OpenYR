^LowHealthSpeedPenalty:
	SpeedMultiplier@CRITICAL:
		Modifier: 75
		RequiresCondition: critical
	GrantConditionOnDamageState@CRITICAL:
		Condition: critical
		ValidDamageStates: Critical

^VehicleDamagedEffects:
	FloatingSpriteEmitter@heavysmoke:
		Image: smoke
		Sequences: small, large
		Lifetime: 40
		Duration: -1
		SpawnFrequency: 10, 20
		Speed: 72
		Gravity: 48
		Offset: 0,0,192
		RequiresCondition: heavydamage
	GrantConditionOnDamageState@heavydamage:
		Condition: heavydamage

^MachineShopRepair:
	ChangesHealth@MACHINESHOP:
		PercentageStep: 1
		Delay: 100
		StartIfBelow: 100
		RequiresCondition: repair
	WithDecoration@MACHINESHOP:
		Image: bonus-pips
		Sequence: repair
		Palette: pips
		Position: TopRight
		ValidRelationships: Ally
		RequiresCondition: repair
	GrantConditionOnPrerequisite@MACHINESHOP:
		Condition: repair
		Prerequisites: camach

^TransportableVehicle:
	Passenger:
		CargoType: Vehicle
		Weight: 3
		Voice: Move

^TransportVehiclesAndInfantries:
	Cargo:
		Types: Infantry, Vehicle
		MaxWeight: 12
		AfterLoadDelay: 0
		BeforeUnloadDelay: 0
		AfterUnloadDelay: 0
		PassengerFacing: 384
		UnloadTerrainTypes: Clear, Rough, Bridge, Rail, Road, DirtRoad, Beach, Ore, Gems
		UnloadVoice: Move
		EjectOnDeath: false
		LoadingCondition: notmobile
		LoadedCondition: loaded
	WithCargoPipsDecoration:
		Margin: 4, 3
		Palette: pips
		Position: BottomLeft
		RequiresSelection: true
		Image: small-color-pips
		EmptySequence: empty
		FullSequence: green
		CustomPipSequences:
			gray: gray
			yellow: yellow
			blue: blue
			red: red

^TransportInfantries:
	Inherits: ^TransportVehiclesAndInfantries
	Cargo:
		Types: Infantry
		MaxWeight: 5
