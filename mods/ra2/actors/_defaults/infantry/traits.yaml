^FeedbackOnDamage:
	GrantConditionOnDamageState@feedback:
		Condition: feedback
		ValidDamageStates: Critical
	VoiceAnnouncement:
		Voice: Feedback
		ValidRelationships: None
		RequiresCondition: feedback

^InfantryPromotable:
	Inherits: ^GainsExperience
	VeterancyOnProduction:
		InitialRank: 2
		Prerequisites: barracks.infiltrated
	WithProductionIconOverlay:
		Types: chevron-veteran
		Prerequisites: barracks.infiltrated

^HealedByHospital:
	ChangesHealth@HOSPITAL:
		PercentageStep: 1
		Delay: 100
		StartIfBelow: 100
		RequiresCondition: heal
	WithDecoration@HOSPITAL:
		Image: bonus-pips
		Sequence: heal
		Palette: pips
		Position: TopRight
		ValidRelationships: Ally
		RequiresCondition: heal
	GrantConditionOnPrerequisite@HOSPITAL:
		Condition: heal
		Prerequisites: cahosp

^DogImmune:
	Targetable@DOGIMMUNITY:
		TargetTypes: DogImmune

^TransportableInfantry:
	Passenger:
		CargoType: Infantry
		Weight: 1
		Voice: Move
